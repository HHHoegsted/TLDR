
services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: tldr
      POSTGRES_USER: tldr
      POSTGRES_PASSWORD: tldr_local_dev

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tldr -d tldr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
